name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a vMAJOR.MINOR.PATCH tag')
          versions = re.findall(r'^## Version: (.+)$', Path('Murgle.toc').read_text(), re.MULTILINE)
          if versions != [tag[1:]]:
              raise SystemExit('Tag and manifest version must match')
          PY

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/run.lua
          python3 tests/test_package.py

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -p 0 -u
          pandoc: 'false'
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
